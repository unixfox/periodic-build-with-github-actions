name: Docker build openresty-ssl-ja3 image

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/docker-build-openresty-ssl-ja3.yml'
      - 'openresty-ssl-ja3/**'

env:
  IMAGE_NAME: quay.io/unixfox/openresty-ssl-ja3

jobs:

  build:

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set number of cores
        run: |
          echo "NUMBER_OF_CORES=$(nproc)" >> $GITHUB_ENV

      - name: Check Out Repo openresty/docker-openresty
        uses: actions/checkout@v7
        with:
          repository: "openresty/docker-openresty"
          ref: 'master'

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          path: 'periodic-build'

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Build and push docker image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./periodic-build/openresty-ssl-ja3/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            RESTY_J=${{ env.NUMBER_OF_CORES }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:

    runs-on: ubuntu-24.04
    needs:
      - build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Set up build timestamp
        run: echo "timestamp=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:openssl3.5.6-nginx1.31.1-latest \
            -t ${{ env.IMAGE_NAME }}:openssl3.5.6-nginx1.31.1-${{ env.timestamp }} \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:openssl3.5.6-nginx1.31.1-latest
