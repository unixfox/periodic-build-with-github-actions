name: Docker build openresty-ssl-ja3 image

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/docker-build-openresty-ssl-ja3.yml'
      - 'openresty-ssl-ja3/**'

env:
  IMAGE_NAME: quay.io/unixfox/openresty-ssl-ja3
  TAG_PREFIX: openssl3.5.6-nginx1.31.1

jobs:

  prepare:
    runs-on: ubuntu-24.04
    outputs:
      timestamp: ${{ steps.ts.outputs.timestamp }}
    steps:
      - name: Set up build timestamp
        id: ts
        run: echo "timestamp=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:

    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
            suffix: "-amd64"
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            suffix: "-arm64"

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Set number of cores
        run: |
          echo "NUMBER_OF_CORES=$(nproc)" >> $GITHUB_ENV

      - name: Check Out Repo openresty/docker-openresty
        uses: actions/checkout@v7
        with:
          repository: "openresty/docker-openresty"
          ref: 'master'

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          path: 'periodic-build'

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./periodic-build/openresty-ssl-ja3/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            RESTY_J=${{ env.NUMBER_OF_CORES }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG_PREFIX }}-latest${{ matrix.suffix }}
            ${{ env.IMAGE_NAME }}:${{ env.TAG_PREFIX }}-${{ needs.prepare.outputs.timestamp }}${{ matrix.suffix }}

  merge:

    needs:
      - prepare
      - build

    runs-on: ubuntu-24.04

    steps:
      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Create and push multi-arch manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG_PREFIX }}-latest
            ${{ env.IMAGE_NAME }}:${{ env.TAG_PREFIX }}-${{ needs.prepare.outputs.timestamp }}
          sources: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG_PREFIX }}-${{ needs.prepare.outputs.timestamp }}-amd64
            ${{ env.IMAGE_NAME }}:${{ env.TAG_PREFIX }}-${{ needs.prepare.outputs.timestamp }}-arm64
