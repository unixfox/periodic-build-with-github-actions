name: Docker build lobehub patched image

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/docker-build-lobehub.yml'
      - 'lobehub/**'

env:
  REGISTRY_IMAGE: quay.io/unixfox/lobehub

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-latest-tag.outputs.tag }}
      timestamp: ${{ steps.get-latest-tag.outputs.timestamp }}
    steps:
      - name: Get latest stable tag
        id: get-latest-tag
        run: |
          # Stable releases only: upstream also tags vX.Y.Z-canary.N prereleases
          TAG=$(git ls-remote --refs --tags https://github.com/lobehub/lobehub.git | awk -F/ '/refs\/tags\/v[0-9]+\.[0-9]/ {print $3}' | grep -v -E 'canary|rc|beta|alpha' | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "Error: Could not fetch latest tag"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
        shell: bash

  # A Next.js build under QEMU takes hours, so each platform builds on a
  # native runner and the merge job stitches the manifest, like upstream.
  build:
    needs: resolve
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Check Out Repo lobehub/lobehub
        uses: actions/checkout@v7
        with:
          repository: "lobehub/lobehub"
          ref: ${{ needs.resolve.outputs.tag }}
          path: 'lobehub-git'

      - name: patch lobehub release
        run: |
          cd lobehub-git
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          git am ../lobehub/patches/*.patch
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./lobehub-git
          file: ./lobehub-git/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SHA=${{ env.sha_short }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [resolve, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            -t ${{ env.REGISTRY_IMAGE }}:${{ needs.resolve.outputs.tag }} \
            -t ${{ env.REGISTRY_IMAGE }}:${{ needs.resolve.outputs.tag }}-${{ needs.resolve.outputs.timestamp }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ needs.resolve.outputs.tag }}
